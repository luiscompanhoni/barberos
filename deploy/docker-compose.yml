# BarberOS em producao num VPS (Hostinger, DigitalOcean...): sistema + Postgres + Caddy (https) + backup.
# Subir (na pasta do projeto no servidor):
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
name: barberos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberos
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      POSTGRES_DB: barberos
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberos"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem porta publicada: o banco so e acessivel pelos containers.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://barberos:${DB_SENHA}@db:5432/barberos
      NODE_ENV: production
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution:8080}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ENDERECOS: ${CADDY_ENDERECOS:-:80}
      CADDY_IP: ${CADDY_IP:-http://ip-nao-configurado.invalid}
      CADDY_IP_DESTINO: ${PAINEL_URL:-http://localhost}
      CADDY_SNI: ${CADDY_IP:-sem-ip.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # WhatsApp nao oficial (QR code). So sobe com COMPOSE_PROFILES=evolution no .env.
  # Sem porta publicada: so o sistema fala com ele. Guarda os dados no mesmo Postgres (schema proprio).
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["evolution"]
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://barberos:${DB_SENHA}@db:5432/barberos?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: barberos
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: BarberOS
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      TZ: America/Sao_Paulo
    volumes:
      - evolution:/evolution/instances
    depends_on:
      db:
        condition: service_healthy

  # Copia do banco todo dia (03h), guarda 14 dias em /opt/barberos/backups.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_SENHA}
      TZ: America/Sao_Paulo
    volumes:
      - ../backups:/backups
    entrypoint: >
      sh -c 'while true; do
        agora=$$(date +%H%M);
        if [ "$$agora" = "0300" ]; then
          arq=/backups/barberos-$$(date +%Y%m%d-%H%M).sql.gz;
          pg_dump -h db -U barberos barberos | gzip > $$arq && echo "backup ok: $$arq";
          find /backups -name "barberos-*.sql.gz" -mtime +14 -delete;
          sleep 60;
        fi;
        sleep 30;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg:
  caddy-data:
  caddy-config:
  evolution:
