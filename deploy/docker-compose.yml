# BarberOS em producao num VPS (Hostinger, DigitalOcean...): sistema + Postgres + Caddy (https) + backup.
# Subir (na pasta do projeto no servidor):
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
name: barberos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberos
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      POSTGRES_DB: barberos
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberos"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem porta publicada: o banco so e acessivel pelos containers.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://barberos:${DB_SENHA}@db:5432/barberos
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ENDERECOS: ${CADDY_ENDERECOS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Copia do banco todo dia (03h), guarda 14 dias em /opt/barberos/backups.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_SENHA}
      TZ: America/Sao_Paulo
    volumes:
      - ../backups:/backups
    entrypoint: >
      sh -c 'while true; do
        agora=$$(date +%H%M);
        if [ "$$agora" = "0300" ]; then
          arq=/backups/barberos-$$(date +%Y%m%d-%H%M).sql.gz;
          pg_dump -h db -U barberos barberos | gzip > $$arq && echo "backup ok: $$arq";
          find /backups -name "barberos-*.sql.gz" -mtime +14 -delete;
          sleep 60;
        fi;
        sleep 30;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg:
  caddy-data:
  caddy-config:
