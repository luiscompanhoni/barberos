# BarberOS de HOMOLOGACAO: banco, aplicativo e processador de vídeo próprios.
name: barberos-homolog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberos
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      POSTGRES_DB: barberos
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberos"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-homolog:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://barberos:${DB_SENHA}@db:5432/barberos
      NODE_ENV: production
      AMBIENTE: homologacao
      ESTUDIO_HABILITADO: "true"
      ESTUDIO_STORAGE_ROOT: /app/media
      ESTUDIO_WORKER_TOKEN: ${ESTUDIO_WORKER_TOKEN:?defina ESTUDIO_WORKER_TOKEN no .env}
    volumes:
      - estudio_media:/app/media
    networks: [default, proxy, estudio]
    depends_on:
      db:
        condition: service_healthy

  video-worker:
    build:
      context: ../workers/video
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ESTUDIO_APP_URL: http://app-homolog:3000
      ESTUDIO_WORKER_TOKEN: ${ESTUDIO_WORKER_TOKEN:?defina ESTUDIO_WORKER_TOKEN no .env}
    networks: [estudio]
    depends_on:
      app-homolog:
        condition: service_healthy
    volumes:
      - estudio_jobs:/worker/jobs
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
      - /home/node:rw,nosuid,size=64m,uid=1000,gid=1000
    shm_size: 256m
    mem_limit: 2g
    cpus: 0.75
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: barberos-proxy
    external: true
  estudio:
    internal: true

volumes:
  pg:
  estudio_media:
  estudio_jobs:
