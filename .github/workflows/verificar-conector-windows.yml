name: Verificar conector no Windows
on:
  push:
    branches: [codex/teste-conector-windows-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduzir preparacao com chave descartavel e sem acesso a VPS
        shell: powershell
        run: .\scripts\publicacao\reproduzir-preparacao-windows.ps1
