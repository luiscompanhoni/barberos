name: Verificar conector no Windows
on:
  push:
    branches: [codex/teste-conector-windows-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar DACL sem administrador e sem SeSecurityPrivilege
        shell: powershell
        run: .\scripts\publicacao\testar-chave-sem-admin.ps1 -Fonte .\scripts\publicacao\funcoes-chave-conector.ps1 -CompararAnterior .\scripts\publicacao\funcoes-chave-v2.ps1
