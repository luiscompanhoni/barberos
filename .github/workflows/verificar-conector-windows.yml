name: Verificar conector no Windows
on:
  push:
    branches: [codex/teste-conector-windows-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar leitura, permissoes e preservacao com chaves descartaveis
        shell: powershell
        run: .\scripts\publicacao\testar-chave-windows.ps1 -Fonte .\scripts\publicacao\funcoes-chave-conector.ps1
