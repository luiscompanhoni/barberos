name: Manutenção manual de cache privado da VPS

on:
  workflow_dispatch:
    inputs:
      imagem_anterior:
        description: ID sha256 da imagem app saudável confirmada no inventário
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publicacao-producao
  cancel-in-progress: false

jobs:
  manter:
    if: github.ref == 'refs/heads/main'
    environment: "produção"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testar preservação e acesso seguro
        run: |
          python3 scripts/publicacao/test_liberar_cache_build.py
          node --test scripts/publicacao/manter-cache-vps.test.mjs
      - name: Liberar somente cache privado regular sem uso há uma hora
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DIR: ${{ vars.VPS_DIR }}
          VPS_PROJECT: ${{ vars.VPS_PROJECT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_IMAGEM_ANTERIOR: ${{ inputs.imagem_anterior }}
        run: node scripts/publicacao/manter-cache-vps.mjs "$RUNNER_TEMP/cache.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cache-preservacao
          path: ${{ runner.temp }}/cache.json
          retention-days: 3
          if-no-files-found: error
