name: Conferir disponibilidade da IA sem gerar mensagens
on:
  workflow_dispatch:
    inputs:
      chave_relatorio:
        description: Chave pública RSA SPKI base64 do destinatário
        required: true
        type: string
permissions:
  contents: read
jobs:
  consultar:
    if: github.ref == 'refs/heads/main'
    environment: "produção"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar metadados do modelo pela autenticação já existente
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DIR: ${{ vars.VPS_DIR }}
          VPS_PROJECT: ${{ vars.VPS_PROJECT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELATORIO_CHAVE_PUBLICA: ${{ inputs.chave_relatorio }}
        run: |
          npm ci --ignore-scripts
          node scripts/publicacao/preparar-prova-ia.mjs "$RUNNER_TEMP/prova-ia.cjs"
          node scripts/publicacao/diagnosticar-ia.mjs "$RUNNER_TEMP/ia.cifrada.json" "$RUNNER_TEMP/prova-ia.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: ia-diagnostico-cifrado
          path: ${{ runner.temp }}/ia.cifrada.json
          retention-days: 1
          if-no-files-found: error
