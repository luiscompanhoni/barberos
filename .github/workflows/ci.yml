# Confere cada push e PR: tipos, lint, testes unitarios, migracoes num banco limpo, testes de fluxo e build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atendimento-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir ASR com áudio sintético e sem rede no runtime
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t atendimento-ci workers/atendimento
          docker run --rm --network none --read-only --memory 768m --cpus 0.5 --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,size=32m --entrypoint python atendimento-ci smoke.py teste.wav
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barberos
          POSTGRES_PASSWORD: barberos
          POSTGRES_DB: barberos
        ports: ["5432:5432", "55439:5432", "15439:5432"]
        options: >-
          --health-cmd "pg_isready -U barberos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Banco descartavel do CI (o resto vem do .env.example: WhatsApp, pagamentos e login simulados).
      DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar
        run: |
          npm ci
          cp .env.example .env
          npx prisma generate
          npx next typegen
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Regras locais de lint (self-check)
        run: npm run lint:rules
      - name: Testes unitários
        run: |
          npm test
          node --test workers/video/tests/*.test.mjs
      - name: Publicação e recuperação (sem publicar)
        run: npm run check:publicacao:servidor
      - name: Migrações num banco limpo
        run: |
          npx prisma migrate deploy
          # Falha se o schema.prisma mudou sem migracao.
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Dados de exemplo
        run: npm run db:seed
      - name: Preparar bancos exclusivos de RH e comandas
        env:
          POSTGRES_SERVICO: ${{ job.services.postgres.id }}
          # Credencial fictícia exclusiva do serviço efêmero deste job; sem permissão de criar bancos.
          DATABASE_URL_RH: postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_regr_rh_20261108
          DATABASE_URL_COMANDAS: postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_regr_comandas_20261108
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_SERVICO" psql -X -v ON_ERROR_STOP=1 -U barberos -d barberos <<'SQL'
          CREATE ROLE auditoria_teste LOGIN PASSWORD 'fixture_ci_descartavel_20261108';
          SQL
          for banco in barberos_ci_local_regr_rh_20261108 barberos_ci_local_regr_comandas_20261108; do
            docker exec "$POSTGRES_SERVICO" createdb -U barberos --owner=auditoria_teste "$banco"
          done
          for destino in "$DATABASE_URL_RH" "$DATABASE_URL_COMANDAS"; do
            DATABASE_URL="$destino" ./node_modules/.bin/prisma migrate deploy
            DATABASE_URL="$destino" npm run db:seed
          done
      - name: Preparar bancos separados da estabilização
        env:
          POSTGRES_SERVICO: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Mesma role restrita dos fluxos; somente o superusuário do serviço cria bancos.
          for banco in barberos_ci_local_seguranca_estabilizacao barberos_estabilizacao_agenda_ci_20261108 barberos_estabilizacao_despesas_ci_20261108 barberos_ci_local_estabilizacao_ci_20261108 barberos_ci_local_estabilizacao_vinculos_ci_20261108 barberos_ci_local_estabilizacao_retificacao_ci_20261108; do
            docker exec "$POSTGRES_SERVICO" createdb -U barberos --owner=auditoria_teste "$banco"
            DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/$banco" ./node_modules/.bin/prisma migrate deploy
          done
      - name: Conferir estabilização, concorrência, Pix e vigências no PostgreSQL
        env:
          AMBIENTE: homologacao
          TZ: America/Sao_Paulo
          SESSION_SECRET: fixture-estabilizacao-ci-sem-credenciais-reais-20261108
          WHATSAPP_PROVIDER: simulador
          WHATSAPP_ENVIOS_BLOQUEADOS: "true"
          WHATSAPP_ATENDIMENTO_IA_PAGA: "false"
          PAGAMENTOS_PROVIDER: simulado
          PAGAMENTOS_EMISSAO_AUTOMATICA_PIX_ATIVA: "false"
          COBRANCA_AUTOMATICA_WHATSAPP_ATIVA: "false"
          AGENTES_EXECUCAO_ATIVA: "false"
          MAQUININHA: manual
          OTP_PROVIDER: console
          PUSH_PROVIDER: simulado
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/estabilizacao-sem-http.cjs" <<'JS'
          const bloquear = () => { throw Error('HTTP externo bloqueado na estabilização sintética'); };
          globalThis.fetch = async () => bloquear();
          for (const nome of ['node:http', 'node:https']) {
            const transporte = require(nome);
            transporte.request = transporte.get = bloquear;
          }
          JS
          export NODE_OPTIONS="--require=$RUNNER_TEMP/estabilizacao-sem-http.cjs"
          conferir_resultado() {
            node -e 'const r=require(process.argv[1]); if (!r.success || r.numPassedTests < Number(process.argv[2]) || r.numPendingTests || r.numTotalTests !== r.numPassedTests) process.exit(1); console.log(r.numPassedTests, "cenários PostgreSQL aprovados sem skips")' "$1" "$2"
          }
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_estabilizacao_agenda_ci_20261108"
          TESTE_ESTABILIZACAO_AGENDA_LOCAL=1 ./node_modules/.bin/vitest run tests/estabilizacao-agenda-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/estabilizacao-agenda.json"
          conferir_resultado "$RUNNER_TEMP/estabilizacao-agenda.json" 14
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_estabilizacao_despesas_ci_20261108"
          TESTE_ESTABILIZACAO_DESPESAS_LOCAL=1 ./node_modules/.bin/vitest run tests/estabilizacao-despesas-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/estabilizacao-despesas.json"
          conferir_resultado "$RUNNER_TEMP/estabilizacao-despesas.json" 12
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_estabilizacao_ci_20261108"
          TESTE_ESTABILIZACAO_FINANCEIRO_LOCAL=1 ./node_modules/.bin/vitest run tests/estabilizacao-financeiro-banco.test.ts tests/estabilizacao-adicionais-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/estabilizacao-financeiro.json"
          conferir_resultado "$RUNNER_TEMP/estabilizacao-financeiro.json" 18
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_estabilizacao_vinculos_ci_20261108"
          TESTE_ESTABILIZACAO_FINANCEIRO_LOCAL=1 ./node_modules/.bin/vitest run tests/estabilizacao-folha-vinculos-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/estabilizacao-folha-vinculos.json"
          conferir_resultado "$RUNNER_TEMP/estabilizacao-folha-vinculos.json" 6
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_estabilizacao_retificacao_ci_20261108"
          TESTE_ESTABILIZACAO_FINANCEIRO_LOCAL=1 ./node_modules/.bin/vitest run tests/estabilizacao-folha-retificacao-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/estabilizacao-folha-retificacao.json"
          conferir_resultado "$RUNNER_TEMP/estabilizacao-folha-retificacao.json" 10
          export DATABASE_URL="postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_seguranca_estabilizacao"
          ./node_modules/.bin/tsx scripts/teste-seguranca-estabilizacao.ts
          ./node_modules/.bin/tsx scripts/teste-seguranca-pix-estabilizacao.ts
          ./node_modules/.bin/tsx scripts/teste-seguranca-vigencias-estabilizacao.ts
      - name: Conferir horários e duração aceita em bancos descartáveis da revisão
        env:
          POSTGRES_SERVICO: ${{ job.services.postgres.id }}
          AMBIENTE: homologacao
          WHATSAPP_PROVIDER: simulador
          WHATSAPP_ENVIOS_BLOQUEADOS: "true"
          PAGAMENTOS_PROVIDER: simulado
          MAQUININHA: manual
          OTP_PROVIDER: console
        run: |
          set -euo pipefail
          camp=barberos_camp_hora_integracao_ci
          cliente=barberos_cliente_teste_20261104
          for banco in "$camp" "$cliente"; do
            docker exec "$POSTGRES_SERVICO" createdb -U barberos "$banco"
            DATABASE_URL="postgresql://barberos:barberos@127.0.0.1:5432/$banco" ./node_modules/.bin/prisma migrate deploy
          done
          docker exec "$POSTGRES_SERVICO" psql -X -v ON_ERROR_STOP=1 -U barberos -d "$cliente" \
            -c 'INSERT INTO configuracao (id, "botAtivo", "agendaExternaAtiva") VALUES (1, false, true)'
          cat > "$RUNNER_TEMP/c6-sem-http.cjs" <<'JS'
          const bloquear = () => { throw Error('HTTP bloqueado na revisão sintética'); };
          globalThis.fetch = async () => bloquear();
          for (const nome of ['node:http', 'node:https']) {
            const transporte = require(nome);
            transporte.request = transporte.get = bloquear;
          }
          JS
          export NODE_OPTIONS="--require=$RUNNER_TEMP/c6-sem-http.cjs"
          export DATABASE_URL="postgresql://barberos:barberos@127.0.0.1:55439/$camp"
          TESTE_HORARIO_CAMPANHA_LOCAL=1 ./node_modules/.bin/vitest run tests/horarios-campanhas-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/c6-horarios.json"
          node -e 'const r=require(process.argv[1]); if (!r.success || r.numPassedTests < 11 || r.numPendingTests || r.numTotalTests !== r.numPassedTests) process.exit(1); console.log(r.numPassedTests, "cenários de horários aprovados")' "$RUNNER_TEMP/c6-horarios.json"
          export DATABASE_URL="postgresql://barberos:barberos@127.0.0.1:15439/$cliente"
          ./node_modules/.bin/tsx scripts/teste-agenda-duracao-confirmada.ts
          test "$(docker exec "$POSTGRES_SERVICO" psql -XAt -U barberos -d "$cliente" -c 'SELECT "agendaExternaAtiva" FROM configuracao WHERE id=1')" = t
      - name: Preparar banco separado do histórico financeiro
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_historico_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_historico_teste
          npx prisma migrate deploy
      - name: Preparar banco separado dos agentes
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_agentes_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_agentes_teste
          npx prisma migrate deploy
      - name: Preparar banco separado dos templates do Estúdio
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_estudio_templates_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_estudio_templates_teste
          npx prisma migrate deploy
      - name: Preparar banco separado do recrutamento
        env:
          DATABASE_URL: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_formularios_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_recrutamento_formularios_teste
          npx prisma migrate deploy
      - name: Preparar banco separado das entrevistas
        env:
          DATABASE_URL: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_entrevistas_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_recrutamento_entrevistas_teste
          npx prisma migrate deploy
      - name: Testes de fluxo (destinos exclusivos por área)
        env:
          DATABASE_URL_RH: postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_regr_rh_20261108
          DATABASE_URL_COMANDAS: postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_regr_comandas_20261108
          DATABASE_URL_HISTORICO: postgresql://barberos:barberos@localhost:5432/barberos_historico_teste
          DATABASE_URL_AGENTES: postgresql://barberos:barberos@localhost:5432/barberos_agentes_teste
          DATABASE_URL_ESTUDIO: postgresql://barberos:barberos@localhost:5432/barberos_estudio_templates_teste
          DATABASE_URL_ENTREVISTAS: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_entrevistas_teste
          DATABASE_URL_RECRUTAMENTO: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_formularios_teste
        run: npm run teste:todos
      - name: Conferir cadastro exclusivo do RH e concorrência sem skips
        env:
          POSTGRES_SERVICO: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql://auditoria_teste:fixture_ci_descartavel_20261108@127.0.0.1:55439/barberos_ci_local_regr_rh_20261109
          TESTE_RH_SEM_CHECKLIST_LOCAL: "1"
          AMBIENTE: homologacao
          WHATSAPP_PROVIDER: simulador
          WHATSAPP_ENVIOS_BLOQUEADOS: "true"
          WHATSAPP_ATENDIMENTO_IA_PAGA: "false"
          PAGAMENTOS_PROVIDER: simulado
          PAGAMENTOS_EMISSAO_AUTOMATICA_PIX_ATIVA: "false"
          COBRANCA_AUTOMATICA_WHATSAPP_ATIVA: "false"
          AGENTES_EXECUCAO_ATIVA: "false"
          MAQUININHA: manual
          OTP_PROVIDER: console
          PUSH_PROVIDER: simulado
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_SERVICO" createdb -U barberos --owner=auditoria_teste barberos_ci_local_regr_rh_20261109
          ./node_modules/.bin/prisma migrate deploy
          npm run db:seed
          cat > "$RUNNER_TEMP/rh-sem-checklist-sem-http.cjs" <<'JS'
          const bloquear = () => { throw Error('HTTP externo bloqueado na revisão sintética do RH'); };
          globalThis.fetch = async () => bloquear();
          for (const nome of ['node:http', 'node:https']) {
            const transporte = require(nome);
            transporte.request = transporte.get = bloquear;
          }
          JS
          export NODE_OPTIONS="--require=$RUNNER_TEMP/rh-sem-checklist-sem-http.cjs"
          ./node_modules/.bin/vitest run tests/rh-sem-checklist-banco.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/rh-sem-checklist.json"
          node -e 'const r=require(process.argv[1]); if (!r.success || r.numPassedTests < 9 || r.numPendingTests || r.numTotalTests !== r.numPassedTests) process.exit(1); console.log(r.numPassedTests, "cenários RH sem checklist aprovados sem skips")' "$RUNNER_TEMP/rh-sem-checklist.json"
      - name: Build
        run: npm run build

  comparar-imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Construir versões com o mesmo contexto
        run: |
          set -euo pipefail
          git show d833182db751a74d3ce52017f11a2824fcb6c735:Dockerfile > "$RUNNER_TEMP/Dockerfile-anterior"
          git show d833182db751a74d3ce52017f11a2824fcb6c735:workers/video/Dockerfile > "$RUNNER_TEMP/Dockerfile-worker-anterior"
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-app-anterior:$GITHUB_SHA" -f "$RUNNER_TEMP/Dockerfile-anterior" .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-app:$GITHUB_SHA" .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-backup:$GITHUB_SHA" -f deploy/backup.Dockerfile deploy
          docker build --target rclone_legado -t "barberos-rclone-legado:$GITHUB_SHA" -f deploy/backup.Dockerfile deploy
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-video-worker-anterior:$GITHUB_SHA" -f "$RUNNER_TEMP/Dockerfile-worker-anterior" workers/video
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-video-worker:$GITHUB_SHA" workers/video
      - name: Verificar permissões da imagem nova
        run: node scripts/publicacao/teste-imagem-app.mjs "barberos-app:$GITHUB_SHA"
      - name: Verificar backup em banco sintético separado
        run: |
          docker tag "barberos-backup:$GITHUB_SHA" "barberos-backup-validacao:$GITHUB_SHA"
          python3 scripts/publicacao/teste-backup-container.py "barberos-backup-validacao:$GITHUB_SHA" "barberos-rclone-legado:$GITHUB_SHA"
      - name: Verificar worker sem privilégios e render sintético
        run: |
          set -euo pipefail
          for imagem in "barberos-video-worker-anterior:$GITHUB_SHA" "barberos-video-worker:$GITHUB_SHA"; do
            docker run --rm --network none --read-only --tmpfs /worker/jobs:rw,nosuid,size=1536m,uid=1000,gid=1000,mode=0700 --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 --tmpfs /home/node:rw,nosuid,size=64m,uid=1000,gid=1000 --entrypoint node "$imagem" -e '
              const fs = require("node:fs"), path = require("node:path");
              const uid = process.getuid(), gid = process.getgid();
              if (uid !== 1000 || gid !== 1000) throw Error("Usuário do worker inesperado");
              function conferir(p) { const s = fs.lstatSync(p); if (s.uid !== uid || s.gid !== gid) throw Error("Proprietário inesperado: " + p); if (s.isDirectory()) for (const n of fs.readdirSync(p)) conferir(path.join(p, n)); }
              conferir("/worker");
              for (const p of ["/usr/bin/chromium", "/usr/bin/ffmpeg", "/usr/bin/ffprobe", "/worker/node_modules/hyperframes/bin/hyperframes.mjs"]) fs.accessSync(p, fs.constants.R_OK);
              fs.writeFileSync("/worker/jobs/.teste", "teste"); fs.unlinkSync("/worker/jobs/.teste");'
          done
          docker run --rm --network none --entrypoint node -v "$PWD/workers/video/tests:/worker/tests:ro" "barberos-video-worker:$GITHUB_SHA" --test tests/render.test.mjs tests/templates.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 0.75 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges:true --shm-size 256m --tmpfs /worker/jobs:rw,nosuid,size=1536m,uid=1000,gid=1000,mode=0700 --tmpfs /tmp:rw,nosuid,size=256m,mode=1777 --tmpfs /home/node:rw,nosuid,size=64m,uid=1000,gid=1000 --entrypoint node -v "$PWD/workers/video/tests:/worker/tests:ro" "barberos-video-worker:$GITHUB_SHA" tests/smoke-templates.mjs
      - name: Verificar inicialização isolada
        run: |
          set -euo pipefail
          id=$(docker run -d --rm --network none -e BARBEROS_QUARENTENA_RESTAURACAO=true --entrypoint node "barberos-app:$GITHUB_SHA" server.js)
          trap 'docker stop "$id" >/dev/null 2>&1 || true' EXIT
          for tentativa in $(seq 1 40); do
            if docker exec "$id" node -e "fetch('http://127.0.0.1:3000/api/saude').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          docker logs "$id"
          exit 1
      - name: Medir imagens e transporte
        run: |
          set -euo pipefail
          anterior=$(docker image inspect "barberos-app-anterior:$GITHUB_SHA" --format '{{.Size}}')
          novo=$(docker image inspect "barberos-app:$GITHUB_SHA" --format '{{.Size}}')
          worker_anterior=$(docker image inspect "barberos-video-worker-anterior:$GITHUB_SHA" --format '{{.Size}}')
          worker_novo=$(docker image inspect "barberos-video-worker:$GITHUB_SHA" --format '{{.Size}}')
          docker save "barberos-app-anterior:$GITHUB_SHA" "barberos-backup:$GITHUB_SHA" "barberos-video-worker-anterior:$GITHUB_SHA" | tee >(wc -c > "$RUNNER_TEMP/anterior-bruto") | gzip -1 | wc -c > "$RUNNER_TEMP/anterior-gzip"
          wait
          docker save "barberos-app:$GITHUB_SHA" "barberos-backup:$GITHUB_SHA" "barberos-video-worker:$GITHUB_SHA" | tee >(wc -c > "$RUNNER_TEMP/novo-bruto") | gzip -1 | wc -c > "$RUNNER_TEMP/novo-gzip"
          wait
          {
            echo "### Comparação das imagens (bytes)"
            echo "- Imagem app descompactada: anterior $anterior; nova $novo."
            echo "- Imagem worker descompactada: anterior $worker_anterior; nova $worker_novo."
            echo "- Exportação das três imagens sem compressão: anterior $(cat "$RUNNER_TEMP/anterior-bruto"); nova $(cat "$RUNNER_TEMP/novo-bruto")."
            echo "- Transporte gzip -1 das três imagens: anterior $(cat "$RUNNER_TEMP/anterior-gzip"); novo $(cat "$RUNNER_TEMP/novo-gzip")."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$novo" -lt "$anterior"
          test "$worker_novo" -lt "$worker_anterior"

