# Confere cada push e PR: tipos, lint, testes unitarios, migracoes num banco limpo, testes de fluxo e build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barberos
          POSTGRES_PASSWORD: barberos
          POSTGRES_DB: barberos
        ports: ["5432:5432", "55439:5432"]
        options: >-
          --health-cmd "pg_isready -U barberos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Banco descartavel do CI (o resto vem do .env.example: WhatsApp, pagamentos e login simulados).
      DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar
        run: |
          npm ci
          cp .env.example .env
          npx prisma generate
          npx next typegen
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Regras locais de lint (self-check)
        run: npm run lint:rules
      - name: Testes unitários
        run: |
          npm test
          node --test workers/video/tests/*.test.mjs
      - name: Publicação e recuperação (sem publicar)
        run: npm run check:publicacao:servidor
      - name: Migrações num banco limpo
        run: |
          npx prisma migrate deploy
          # Falha se o schema.prisma mudou sem migracao.
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Dados de exemplo
        run: npm run db:seed
      - name: Preparar banco separado do histórico financeiro
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_historico_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_historico_teste
          npx prisma migrate deploy
      - name: Preparar banco separado dos agentes
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_agentes_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_agentes_teste
          npx prisma migrate deploy
      - name: Preparar banco separado dos templates do Estúdio
        env:
          DATABASE_URL: postgresql://barberos:barberos@localhost:5432/barberos_estudio_templates_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_estudio_templates_teste
          npx prisma migrate deploy
      - name: Preparar banco separado do recrutamento
        env:
          DATABASE_URL: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_formularios_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_recrutamento_formularios_teste
          npx prisma migrate deploy
      - name: Preparar banco separado das entrevistas
        env:
          DATABASE_URL: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_entrevistas_teste
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U barberos barberos_recrutamento_entrevistas_teste
          npx prisma migrate deploy
      - name: Testes de fluxo (histórico, agentes e Estúdio em bancos separados)
        env:
          DATABASE_URL_HISTORICO: postgresql://barberos:barberos@localhost:5432/barberos_historico_teste
          DATABASE_URL_AGENTES: postgresql://barberos:barberos@localhost:5432/barberos_agentes_teste
          DATABASE_URL_ESTUDIO: postgresql://barberos:barberos@localhost:5432/barberos_estudio_templates_teste
          DATABASE_URL_ENTREVISTAS: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_entrevistas_teste
          DATABASE_URL_RECRUTAMENTO: postgresql://barberos:barberos@127.0.0.1:55439/barberos_recrutamento_formularios_teste
        run: npm run teste:todos
      - name: Build
        run: npm run build

  comparar-imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Construir versões com o mesmo contexto
        run: |
          set -euo pipefail
          git show d833182db751a74d3ce52017f11a2824fcb6c735:Dockerfile > "$RUNNER_TEMP/Dockerfile-anterior"
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-app-anterior:$GITHUB_SHA" -f "$RUNNER_TEMP/Dockerfile-anterior" .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-app:$GITHUB_SHA" .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-backup:$GITHUB_SHA" -f deploy/backup.Dockerfile deploy
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "barberos-video-worker:$GITHUB_SHA" workers/video
      - name: Verificar permissões da imagem nova
        run: node scripts/publicacao/teste-imagem-app.mjs "barberos-app:$GITHUB_SHA"
      - name: Verificar inicialização isolada
        run: |
          set -euo pipefail
          id=$(docker run -d --rm --network none -e BARBEROS_QUARENTENA_RESTAURACAO=true --entrypoint node "barberos-app:$GITHUB_SHA" server.js)
          trap 'docker stop "$id" >/dev/null 2>&1 || true' EXIT
          for tentativa in $(seq 1 40); do
            if docker exec "$id" wget -Y off -qO /dev/null http://127.0.0.1:3000/entrar; then exit 0; fi
            sleep 1
          done
          docker logs "$id"
          exit 1
      - name: Medir imagens e transporte
        run: |
          set -euo pipefail
          anterior=$(docker image inspect "barberos-app-anterior:$GITHUB_SHA" --format '{{.Size}}')
          novo=$(docker image inspect "barberos-app:$GITHUB_SHA" --format '{{.Size}}')
          docker save "barberos-app-anterior:$GITHUB_SHA" "barberos-backup:$GITHUB_SHA" "barberos-video-worker:$GITHUB_SHA" | tee >(wc -c > "$RUNNER_TEMP/anterior-bruto") | gzip -1 | wc -c > "$RUNNER_TEMP/anterior-gzip"
          wait
          docker save "barberos-app:$GITHUB_SHA" "barberos-backup:$GITHUB_SHA" "barberos-video-worker:$GITHUB_SHA" | tee >(wc -c > "$RUNNER_TEMP/novo-bruto") | gzip -1 | wc -c > "$RUNNER_TEMP/novo-gzip"
          wait
          {
            echo "### Comparação das imagens (bytes)"
            echo "- Imagem app descompactada: anterior $anterior; nova $novo."
            echo "- Exportação das três imagens sem compressão: anterior $(cat "$RUNNER_TEMP/anterior-bruto"); nova $(cat "$RUNNER_TEMP/novo-bruto")."
            echo "- Transporte gzip -1 das três imagens: anterior $(cat "$RUNNER_TEMP/anterior-gzip"); novo $(cat "$RUNNER_TEMP/novo-gzip")."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$novo" -lt "$anterior"

