name: Arquivar dois renderizadores históricos com restauração validada

on:
  workflow_dispatch:
    inputs:
      retomar:
        description: Retomar a cópia íntegra já preparada para esta imagem
        required: false
        type: boolean
        default: false
      alvo:
        description: Uma das duas imagens autorizadas, incluindo seus aliases fechados
        required: true
        type: choice
        options:
          - 102a3911fd6b38c635af9cf9cb7718e04f0796db
          - d10b3b1c7be93faa9f5433732a18a2602620bf25
      imagem_anterior:
        description: ID sha256 da imagem app saudável confirmada no inventário
        required: true
        type: string
        default: sha256:ad5656989e8ec6e5d2a5e1e6d0a9c8cf7929d24589e626e2673698d22df59366
      chave_relatorio:
        description: Chave pública RSA SPKI base64 para o comprovante cifrado
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publicacao-producao
  cancel-in-progress: false

jobs:
  arquivar:
    if: github.ref == 'refs/heads/main'
    environment: "produção"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exigir CI push aprovado para este commit exato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --json headSha,headBranch,event,status,conclusion > "$RUNNER_TEMP/ci-renderizadores.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validarCi } from './scripts/publicacao/arquivar-renderizadores-vps.mjs';
          validarCi(JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ci-renderizadores.json')), process.env);
          JS
      - name: Conferir fonte nominal e recuperação sem acesso à VPS
        run: |
          python3 -B scripts/publicacao/test_arquivar_renderizadores.py
          node --test scripts/publicacao/transferir-arquivos-workers.test.mjs
          node --test scripts/publicacao/arquivar-homolog-vps.test.mjs
          node --test scripts/publicacao/arquivar-renderizadores-vps.test.mjs
      - name: Restaurar no Linux e executar render sem rede antes de descarregar a imagem da VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DIR: ${{ vars.VPS_DIR }}
          VPS_PROJECT: ${{ vars.VPS_PROJECT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_IMAGEM_ANTERIOR: ${{ inputs.imagem_anterior }}
          ARQUIVAMENTO_ALVO: ${{ inputs.alvo }}
          ARQUIVAMENTO_RETOMAR: ${{ inputs.retomar }}
          ARQUIVAMENTO_CI_JSON: ${{ runner.temp }}/ci-renderizadores.json
          RELATORIO_CHAVE_PUBLICA: ${{ inputs.chave_relatorio }}
        run: node scripts/publicacao/arquivar-renderizadores-vps.mjs "$RUNNER_TEMP/renderizadores-arquivamento.cifrado.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderizadores-arquivamento-comprovante-cifrado
          path: ${{ runner.temp }}/renderizadores-arquivamento.cifrado.json
          retention-days: 1
          if-no-files-found: error
