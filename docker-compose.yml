services:
  db:
    image: postgres:16-alpine
    container_name: barberos-db
    environment:
      POSTGRES_USER: barberos
      POSTGRES_PASSWORD: barberos
      POSTGRES_DB: barberos
    ports:
      - "5433:5432"
    volumes:
      - barberos-pg:/var/lib/postgresql/data

volumes:
  barberos-pg:
